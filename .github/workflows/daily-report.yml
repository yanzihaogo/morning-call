name: 免费混合每日晨报（Coze + Gemini 3.7）

on:
  schedule:
    # 每天北京时间 07:00（UTC 前一天 23:00）
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai requests

      # GitHub 托管 runner 每次都是新环境；先恢复历史，才能跨天去重。
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: daily_report_history.json
          key: daily-report-history-${{ github.run_id }}
          restore-keys: |
            daily-report-history-

      - name: Generate and send report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
          COZE_BOT_ID: ${{ secrets.COZE_BOT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: "465"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}

          # Gemini 只解读 PubMed 文献，不调用付费 Google Search grounding。
          GEMINI_MODEL: gemini-3.7-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash
          GEMINI_THINKING_LEVEL: low
          GEMINI_MAX_OUTPUT_TOKENS: "12000"
          HISTORY_FILE: daily_report_history.json
        run: python military_grid.py

      # Python 脚本仅在邮件发送成功后写历史文件，因此只在成功时保存缓存。
      - name: Save report history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: daily_report_history.json
          key: daily-report-history-${{ github.run_id }}
